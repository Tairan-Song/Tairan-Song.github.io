<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="740" viewBox="0 175 1536 740" role="img" aria-labelledby="title description">
  <title id="title">Geometric Sisyphus</title>
  <desc id="description">A minimalist geometric figure pushes a circular boulder uphill. The drawing uses two circles and straight line segments.</desc>
