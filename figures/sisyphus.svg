    <line x1="52" y1="870.460" x2="1485" y2="454.890" />
    <circle cx="870" cy="425" r="200" />
    <circle cx="592" cy="451" r="28" />
    <polyline points="672.577,457 621,493 566,497 522,540 483,632 431,695 402,768.960" />
    <polyline points="522,540 610,600 570,720.240" />
  </g>
</svg>
